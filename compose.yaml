services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diettracker
      POSTGRES_USER: diettracker
      POSTGRES_PASSWORD: diettracker_local
    ports:
      - "5432:5432"
    volumes:
      - diettracker_postgres_data:/var/lib/postgresql/data

volumes:
  diettracker_postgres_data:
