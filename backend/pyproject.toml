[project]
name = "diettracker"
version = "0.1.0"
description = "FastAPI backend for the DietTracker React application"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "openai>=2.44.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.8",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
